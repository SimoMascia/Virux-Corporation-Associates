<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VC&A Antivirus · SCP Foundation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay-noise"></div>
    <div class="scan-line"></div>

    <!-- Initial Login Overlay -->
    <div id="initial-login-overlay" class="modal">
        <div class="modal-content">
            <h2>VC&A ANTIVIRUS SYSTEM</h2>
            <p>Restricted Access</p>
            <input type="password" id="initial-password-input" class="modal-field" placeholder="PASSWORD" autocomplete="off">
            <div class="modal-buttons">
                <button id="initial-login-btn" class="btn">ACCESS</button>
            </div>
            <div id="initial-login-error" class="error-message"></div>
        </div>
    </div>

    <div class="container" id="main-container" style="display: none;">
        <header>
            <div class="header-left">
                <span class="logo">SCP FOUNDATION</span>
                <span class="badge">IT DEPT · TERMINAL INSPECTION</span>
            </div>
            <div class="header-right">
                <span id="system-time">--:--:--</span>
                <span class="blink">● SYS.ON</span>
            </div>
        </header>

        <main>
            <div id="breadcrumb" class="breadcrumb">
                <span id="zone-title">ALL ZONES</span>
            </div>

            <div id="content-area" class="content-panel">
                <!-- Dynamic content -->
            </div>

            <div id="admin-panel" class="admin-panel hidden">
                <div class="admin-header">
                    <span>⚙️ ADMINISTRATOR MODE</span>
                    <button id="logout-admin" class="btn-logout">LOGOUT</button>
                </div>
                <div id="admin-actions" class="admin-actions"></div>
            </div>
        </main>

        <footer>
            <div class="footer-left">
                <button id="back-btn" class="btn" disabled>← BACK</button>
                <button id="refresh-btn" class="btn">⟲ REFRESH</button>
            </div>
            <div class="footer-center">
                <span id="status-message">● CONNECTED TO DATABASE</span>
            </div>
            <div class="footer-right">
                <button id="login-btn" class="btn">📡 REQUEST SUPERVISION</button>
            </div>
        </footer>
    </div>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <h2>ADMIN AUTHENTICATION</h2>
            <input type="password" id="password-input" placeholder="PASSWORD" autocomplete="off">
            <div class="modal-buttons">
                <button id="confirm-login" class="btn">LOGIN</button>
                <button id="cancel-login" class="btn">CANCEL</button>
            </div>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <!-- Add Modal -->
    <div id="add-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">ADD</h2>
            <div id="modal-fields"></div>
            <div class="modal-buttons">
                <button id="confirm-add" class="btn">CONFIRM</button>
                <button id="cancel-add" class="btn">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
